# Connection of Parapka to the multi-agent SDLC pipeline, see
# https://github.com/devTomaszStoklosa/sdlc-multi-agent-pipeline/blob/main/docs/onboarding.md
# Every field left out takes the value of the organization baseline, and a
# change of this file is always high-impact (FR-10.3).
version: 1

commands:
  install: npm ci
  # No install scripts, because the session may name another package than the plan.
  update_lockfile: npm install --ignore-scripts
  build: npm run typecheck
  test: npm test
  lint: npm run lint -- --no-warn-ignored
  format: npx prettier --write --ignore-unknown
  coverage: npm run coverage

high_impact:
  # Cryptography, the relay contract, database migrations and the content
  # library (hints must never pressure, spec ZP-5) always need an approved plan.
  extra_paths:
    - "packages/crypto/**"
    - "services/relay/**"
    - "**/migrations/**"
    - "content/**"
