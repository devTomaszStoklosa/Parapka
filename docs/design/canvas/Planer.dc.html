<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Parapka · Planer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Plus+Jakarta+Sans:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F1F8}
a{color:#5B4BD6}a:hover{color:#4335B8}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #5B4BD6;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 1240px; position: relative; overflow: hidden; box-sizing: border-box; background: #F4F1F8; color: #1F1A2E; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<main style="box-sizing: border-box; padding: 56px 20px 200px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Planer</h1>
<button type="button" aria-label="Zestaw startowy obowiązków" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #FFFFFF; color: #1F1A2E; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
</button>
</header>

<div role="group" aria-label="Widok" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: #E9E4F0">
<sc-for list="{{ views }}" as="v" hint-placeholder-count="3">
<button type="button" onClick="{{ v.pick }}" aria-pressed="{{ v.pressed }}" style="height: 44px; border: 0; border-radius: 999px; background: {{ v.bg }}; color: #1F1A2E; font-size: 14px; font-weight: 700; box-shadow: {{ v.shadow }}">{{ v.label }}</button>
</sc-for>
</div>

<div role="group" aria-label="Filtr" style="display: flex; gap: 8px">
<sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
<button type="button" onClick="{{ f.pick }}" aria-pressed="{{ f.pressed }}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1.5px solid {{ f.border }}; background: {{ f.bg }}; color: {{ f.fg }}; font-size: 13px; font-weight: 700">{{ f.label }}</button>
</sc-for>
</div>

<sc-if value="{{ showStrip }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 8px; border-radius: 22px; background: #FFFFFF">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
<span style="height: 60px; border-radius: 16px; background: {{ d.bg }}; color: {{ d.fg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 11px; font-weight: 600; opacity: 0.85">{{ d.name }}</span>
<span style="font-size: 17px; font-weight: 700">{{ d.num }}</span>
<span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: {{ d.dot }}"></span>
</span>
</sc-for>
</div>
</sc-if>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 4px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #5F5873; letter-spacing: 0.04em; text-transform: uppercase">{{ g.title }}<span style="font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none">{{ g.note }}</span></h2>
<ul style="list-style: none; margin: 0; padding: 0; border-radius: 22px; background: #FFFFFF; overflow: hidden; box-shadow: 0 1px 2px rgba(31,26,46,0.04), 0 8px 24px rgba(31,26,46,0.06)">
<sc-for list="{{ g.items }}" as="t" hint-placeholder-count="2">
<li style="position: relative; border-bottom: 1px solid {{ t.line }}">
<sc-if value="{{ t.swiped }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 0; right: 0; bottom: 0; width: 112px; background: #1F1A2E; display: flex; align-items: center; justify-content: center">
<button type="button" onClick="{{ t.handOff }}" style="width: 100%; height: 100%; border: 0; background: transparent; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg>Nie dam rady</button>
</div>
</sc-if>
<div style="position: relative; display: flex; align-items: center; gap: 6px; min-height: 66px; padding: 6px 12px 6px 6px; background: #FFFFFF; transform: translateX({{ t.shift }}px); box-shadow: {{ t.rowShadow }}">
<button type="button" onClick="{{ t.toggle }}" aria-pressed="{{ t.pressed }}" aria-label="{{ t.aria }}" style="width: 44px; height: 44px; flex: none; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ t.open }}" hint-placeholder-val="{{ true }}"><span style="display: block; width: 24px; height: 24px; border-radius: 8px; border: 2px solid #8C84A0; box-sizing: border-box"></span></sc-if>
<sc-if value="{{ t.done }}" hint-placeholder-val="{{ false }}"><span style="width: 24px; height: 24px; border-radius: 8px; background: #1F1A2E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span></sc-if>
</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 700; color: {{ t.titleColor }}; text-decoration: {{ t.deco }}">{{ t.title }}</span>
<span style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: #5F5873">
<sc-if value="{{ t.repeat }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a7 7 0 0 1 12-4.9L18 8"></path><path d="M18 3v5h-5"></path><path d="M20 13a7 7 0 0 1-12 4.9L6 16"></path><path d="M6 21v-5h5"></path></svg></sc-if>
{{ t.meta }}</span>
</div>
<span style="flex: none; height: 26px; padding: 0 10px; border-radius: 999px; background: {{ t.chipBg }}; color: {{ t.chipFg }}; font-size: 12px; font-weight: 700; display: flex; align-items: center">{{ t.who }}</span>
</div>
</li>
</sc-for>
</ul>
</section>
</sc-for>

<section aria-labelledby="sum-title" style="margin-top: 4px; padding: 18px; border-radius: 24px; background: #ECE9FD; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h2 id="sum-title" style="margin: 0; font-size: 15px; font-weight: 700">Ten tydzień</h2>
<span style="font-size: 12px; color: #5F5873">22–29 listopada</span>
</div>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; line-height: 1.2; font-weight: 700">Zrobiliście razem 14 rzeczy.</p>
<div aria-hidden="true" style="display: flex; gap: 3px; height: 10px">
<span style="flex: 6; border-radius: 999px; background: #5B4BD6"></span>
<span style="flex: 2; border-radius: 999px; background: #1F1A2E"></span>
<span style="flex: 6; border-radius: 999px; background: #C2375E"></span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700">
<span style="color: #4335B8">Ty 6</span><span>Razem 2</span><span style="color: #A12D4E">Ola 6</span>
</div>
</section>

</main>

<sc-if value="{{ showToast }}" hint-placeholder-val="{{ true }}">
<div role="status" style="position: absolute; left: 20px; right: 92px; bottom: 112px; height: 56px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 18px; background: #1F1A2E; color: #FFFFFF; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(31,26,46,0.3)">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 26 26" style="flex: none"><circle cx="13" cy="13" r="10" fill="none" stroke="#4A4360" stroke-width="3"></circle><circle cx="13" cy="13" r="10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="44 63" stroke-linecap="round" transform="rotate(-90 13 13)"></circle><text x="13" y="17" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif">7</text></svg>
<span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ toastText }}</span>
<button type="button" onClick="{{ undo }}" style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #C9C3FF; font-size: 13px; font-weight: 700">Cofnij</button>
</div>
</sc-if>

<button type="button" aria-label="Dodaj obowiązek" style="position: absolute; right: 20px; bottom: 108px; width: 60px; height: 60px; border: 0; border-radius: 22px; background: #5B4BD6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px rgba(91,75,214,0.4)">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>

<nav aria-label="Główna nawigacja" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 68px; box-sizing: border-box; padding: 0 8px; border-radius: 999px; background: #1F1A2E; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 12px 32px rgba(31,26,46,0.28)">
<a href="Main.dc.html" aria-label="Dziś" style="width: 52px; height: 52px; border-radius: 999px; color: #C9C3DB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></a>
<a href="Cykl.dc.html" aria-label="Cykl" style="width: 52px; height: 52px; border-radius: 999px; color: #C9C3DB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></a>
<a href="Planer.dc.html" aria-current="page" style="height: 52px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #1F1A2E; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 10h18M8.5 15l2 2 4-4"></path></svg>Planer</a>
<a href="Glowa.dc.html" aria-label="Głowa" style="width: 52px; height: 52px; border-radius: 999px; color: #C9C3DB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17h10a4 4 0 0 0 .8-7.9A6 6 0 0 0 6.2 8.1 4.5 4.5 0 0 0 7 17z"></path><path d="M8 21h.01M11 20h.01"></path></svg></a>
<a href="Zgoda.dc.html" aria-label="Ustawienia" style="width: 52px; height: 52px; border-radius: 999px; color: #C9C3DB; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { view: 'week', filter: 'all', done: { zakupy: true }, handedOff: false, toast: 'Usunięto „Odkurzyć auto”' };
  }
  renderVals() {
    const s = this.state || {};
    const done = s.done || {};
    const WHO = {
      me: { label: 'Ty', bg: '#ECE9FD', fg: '#4335B8' },
      ola: { label: 'Ola', bg: '#FCE6ED', fg: '#A12D4E' },
      turnOla: { label: 'Na zmianę · Ola', bg: '#FCE6ED', fg: '#A12D4E' },
      both: { label: 'Oboje', bg: '#F4F1F8', fg: '#1F1A2E' },
      any: { label: 'Ktokolwiek', bg: '#F4F1F8', fg: '#1F1A2E' }
    };
    const FILTER = { all: null, mine: ['me'], ola: ['ola', 'turnOla'], shared: ['both', 'any'] };
    const tasks = [
      { id: 'filtr', group: 'late', title: 'Wymienić filtr w okapie', meta: 'Termin: poniedziałek', who: 'me' },
      { id: 'zosia', group: 'today', title: 'Odebrać Zosię z przedszkola', meta: '16:00 · przypomnienie 15:30', who: s.handedOff ? 'any' : 'me', swipe: !s.handedOff },
      { id: 'zakupy', group: 'today', title: 'Zakupy na weekend', meta: 'Zrobione przez Olę, 9:12', who: 'both' },
      { id: 'prad', group: 'today', title: 'Zapłacić za prąd', meta: 'Termin: piątek', who: 'any' },
      { id: 'basen', group: 'thu', title: 'Basen Antka', meta: '17:30 · pon i czw', who: 'turnOla', repeat: true },
      { id: 'pranie', group: 'thu', title: 'Pranie ręczników', meta: 'co tydzień', who: 'ola', repeat: true },
      { id: 'piec', group: 'none', title: 'Umówić przegląd pieca', meta: 'bez terminu', who: 'any' }
    ];
    const GROUPS = [
      { id: 'late', title: 'Do zrobienia', note: '' },
      { id: 'today', title: 'Dziś', note: 'środa, 25' },
      { id: 'thu', title: 'Jutro', note: 'czwartek, 26' },
      { id: 'none', title: 'Bez terminu', note: '' }
    ];
    const VISIBLE = { today: ['late', 'today'], week: ['late', 'today', 'thu'], all: ['late', 'today', 'thu', 'none'] };
    const allowed = FILTER[s.filter];
    const groups = GROUPS.filter((g) => VISIBLE[s.view].indexOf(g.id) >= 0).map((g) => {
      const list = tasks.filter((t) => t.group === g.id && (!allowed || allowed.indexOf(t.who) >= 0));
      return {
        title: g.title, note: g.note, hasItems: list.length > 0,
        items: list.map((t, i) => {
          const isDone = !!done[t.id];
          const w = WHO[t.who];
          return {
            title: t.title, meta: t.meta, repeat: !!t.repeat, who: w.label, chipBg: w.bg, chipFg: w.fg,
            done: isDone, open: !isDone, pressed: isDone ? 'true' : 'false', aria: 'Zrobione: ' + t.title,
            titleColor: isDone ? '#5F5873' : '#1F1A2E', deco: isDone ? 'line-through' : 'none',
            swiped: !!t.swipe, shift: t.swipe ? -112 : 0, rowShadow: t.swipe ? '8px 0 16px rgba(31,26,46,0.08)' : 'none',
            line: i === list.length - 1 ? 'transparent' : '#EEE9F3',
            toggle: () => this.setState({ done: Object.assign({}, done, { [t.id]: !isDone }) }),
            handOff: () => this.setState({ handedOff: true, toast: 'Oddane. Teraz: ktokolwiek' })
          };
        })
      };
    }).filter((g) => g.hasItems);
    const views = [['today', 'Dziś'], ['week', 'Tydzień'], ['all', 'Wszystkie']].map(([id, label]) => ({
      label: label, pressed: s.view === id ? 'true' : 'false',
      bg: s.view === id ? '#FFFFFF' : 'transparent', shadow: s.view === id ? '0 2px 8px rgba(31,26,46,0.10)' : 'none',
      pick: () => this.setState({ view: id })
    }));
    const filters = [['all', 'Wszystkie'], ['mine', 'Moje'], ['ola', 'Oli'], ['shared', 'Wspólne']].map(([id, label]) => {
      const on = s.filter === id;
      return { label: label, pressed: on ? 'true' : 'false', bg: on ? '#1F1A2E' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F1A2E', border: on ? '#1F1A2E' : '#D9D3E4', pick: () => this.setState({ filter: id }) };
    });
    const names = ['Pn', 'Wt', 'Śr', 'Cz', 'Pt', 'Sb', 'Nd'];
    const dots = [true, false, true, true, true, false, true];
    const days = names.map((n, i) => {
      const today = i === 2;
      return { name: n, num: 23 + i, bg: today ? '#1F1A2E' : 'transparent', fg: today ? '#FFFFFF' : '#1F1A2E', dot: dots[i] ? (today ? '#FFFFFF' : '#5B4BD6') : 'transparent' };
    });
    return {
      views: views, filters: filters, days: days, groups: groups,
      showStrip: s.view === 'week',
      showToast: !!s.toast, toastText: s.toast || '',
      undo: () => this.setState(s.handedOff && s.toast && s.toast.indexOf('Oddane') === 0 ? { handedOff: false, toast: '' } : { toast: '' })
    };
  }
}
</script>
</body>
</html>
