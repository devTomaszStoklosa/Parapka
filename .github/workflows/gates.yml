# Quality gates of the SDLC pipeline (QG-7.1 to QG-7.9). The workflow and job
# names are part of the contract: orchestrate.yml waits for "Gates", and the
# required checks of the "gates" ruleset are named `<job> / <reusable job>`.
# The pipeline is pinned by the same full commit SHA in `uses:` and
# `pipeline-ref`, because a tag can move.
name: Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/gates.yml@f9c9a603c5f22864a6d14a4593de9a220e7160be
    permissions:
      contents: read
      security-events: write
    with:
      pipeline-ref: f9c9a603c5f22864a6d14a4593de9a220e7160be

  scope:
    if: github.event_name == 'pull_request'
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/scope-gate.yml@f9c9a603c5f22864a6d14a4593de9a220e7160be
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: f9c9a603c5f22864a6d14a4593de9a220e7160be
      app-id: ${{ vars.APP_ID }}
