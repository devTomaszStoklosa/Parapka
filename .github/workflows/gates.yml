# Quality gates of the SDLC pipeline (QG-7.1 to QG-7.9). The workflow and job
# names are part of the contract: orchestrate.yml waits for "Gates", and the
# required checks of the "gates" ruleset are named `<job> / <reusable job>`.
# The pipeline is pinned by the same full commit SHA in `uses:` and
# `pipeline-ref`, because a tag can move.
name: Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/gates.yml@a79eb1052185ac9f96d6368f69aa5202ecb821bb
    permissions:
      contents: read
      security-events: write
    with:
      pipeline-ref: a79eb1052185ac9f96d6368f69aa5202ecb821bb

  scope:
    if: github.event_name == 'pull_request'
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/scope-gate.yml@a79eb1052185ac9f96d6368f69aa5202ecb821bb
    permissions:
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: a79eb1052185ac9f96d6368f69aa5202ecb821bb
      app-id: ${{ vars.APP_ID }}
