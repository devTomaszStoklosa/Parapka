# One Claude Code session with the pipeline's hooks and no run, started by
# hand from main, the only branch with access to the `agents` environment. It
# checks the token and the hook commands without using a run. The default
# trial config of the pipeline matches the npm commands of .sdlc-agents.yml.
name: Agent trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/agent-trial.yml@a79eb1052185ac9f96d6368f69aa5202ecb821bb
    permissions:
      contents: read
    with:
      pipeline-ref: a79eb1052185ac9f96d6368f69aa5202ecb821bb
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
