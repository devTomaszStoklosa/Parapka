# One Claude Code session with the pipeline's hooks and no run, started by
# hand from main, the only branch with access to the `agents` environment. It
# checks the token and the hook commands without using a run. The default
# trial config of the pipeline matches the npm commands of .sdlc-agents.yml.
name: Agent trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/agent-trial.yml@a38e96779cdecc2570610adc5356ba48cabd4f1d
    permissions:
      contents: read
    with:
      pipeline-ref: a38e96779cdecc2570610adc5356ba48cabd4f1d
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
