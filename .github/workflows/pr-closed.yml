# Ends a pipeline run in `done` when a person merges or closes its pull
# request (FR-4.35), outside the concurrency group of the run.
name: Pull request closed

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  pr-closed:
    uses: devTomaszStoklosa/sdlc-multi-agent-pipeline/.github/workflows/terminate.yml@cfd3e16bcfe9166add7b9fa3b0131c1a45747d1c
    # actions: write is used only by the cancel job, with GITHUB_TOKEN.
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    with:
      pipeline-ref: cfd3e16bcfe9166add7b9fa3b0131c1a45747d1c
      app-client-id: ${{ vars.APP_CLIENT_ID }}
      app-id: ${{ vars.APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
