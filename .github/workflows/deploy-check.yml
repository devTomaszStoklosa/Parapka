name: deploy-check

on:
  pull_request:
    paths:
      - "services/relay/**"
      - "packages/domain/**"
      - "packages/protocol/**"
      - "deploy/**"
      - "package-lock.json"
      - ".github/workflows/deploy-check.yml"
  push:
    branches: [main]
    paths:
      - "services/relay/**"
      - "packages/domain/**"
      - "packages/protocol/**"
      - "deploy/**"
      - "package-lock.json"
      - ".github/workflows/deploy-check.yml"

permissions:
  contents: read

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build relay image
        run: docker build -t parapka-relay:check -f services/relay/Dockerfile .
      - name: Validate compose file
        run: |
          cp deploy/env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Smoke test /health
        run: |
          docker run -d --name relay -p 3000:3000 parapka-relay:check
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs relay
          exit 1
